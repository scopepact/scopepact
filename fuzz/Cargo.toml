[package]
name = "scopepact-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
ed25519-dalek = "2.2.0"
hex = "0.4.3"
libfuzzer-sys = "0.4"
scopepact-guard = { path = "../crates/guard" }
serde_json = "1.0.145"
tempfile = "3"

[[bin]]
name = "mcp_message"
path = "fuzz_targets/mcp_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signed_inputs"
path = "fuzz_targets/signed_inputs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "state_recovery"
path = "fuzz_targets/state_recovery.rs"
test = false
doc = false
bench = false

[[bin]]
name = "guard_effect"
path = "fuzz_targets/guard_effect.rs"
test = false
doc = false
bench = false
