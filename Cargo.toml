[workspace]
members = ["crates/protocol", "crates/core", "crates/guard"]
default-members = ["crates/protocol", "crates/core", "crates/guard"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
ed25519-dalek = "2.2.0"
getrandom = "0.3.4"
hex = "0.4.3"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["aws_lc_rs"] }
prost = "0.14.3"
prost-build = "0.14.1"
scopepact-core = { version = "0.1.0", path = "crates/core" }
scopepact-protocol = { version = "0.1.0", path = "crates/protocol" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
thiserror = "2.0.18"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
